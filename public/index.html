<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XD管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#b45309', light: '#d97706', dark: '#92400e' },
            warm: {
              50: '#fefdfb', 100: '#fdf8f0', 200: '#f5efe6',
              300: '#e8dfd3', 400: '#b8a898', 500: '#8a7a6a',
              600: '#6b5d4f', 700: '#4a3f35', 800: '#352e26', 900: '#1f1b16',
            },
          }
        }
      }
    }
  </script>
  <style>
    body { background: #f9f7f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nav-link { transition: all 0.15s ease; }
    .nav-link:hover { background: #f5efe6; color: #4a3f35; }
    .nav-link.active { background: #f0e9de; color: #352e26; font-weight: 500; }
    .nav-icon { width: 18px; height: 18px; opacity: 0.35; }
    .nav-link:hover .nav-icon, .nav-link.active .nav-icon { opacity: 0.7; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d6cfc5; border-radius: 3px; }
    .card { background: #fffffe; border: 1px solid #ebe5dc; border-radius: 0.5rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-warm-50 border-b border-warm-200 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <svg class="w-7 h-7 text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      <h1 class="text-lg font-semibold text-warm-800">微信小店管理</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-sm text-warm-400">当前店铺</span>
      <div id="header-store-info">
        <span class="text-sm text-warm-400">加载中...</span>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <nav class="w-52 bg-warm-50 border-r border-warm-200 text-warm-500 flex-shrink-0 flex flex-col pt-5 overflow-y-auto">
      <div class="px-5 mb-1.5">
        <p class="text-xs tracking-wider text-warm-400 font-medium">配置</p>
      </div>
      <a href="#/store-config" data-route="/store-config"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        店铺管理
      </a>
      <a href="#/shop" data-route="/shop"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
        店铺信息
      </a>

      <div class="px-5 mt-5 mb-1.5">
        <p class="text-xs tracking-wider text-warm-400 font-medium">记录</p>
      </div>
      <a href="#/logs" data-route="/logs"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
        处理记录
      </a>

      <div class="px-5 mt-5 mb-1.5">
        <p class="text-xs tracking-wider text-warm-400 font-medium">物流</p>
      </div>
      <a href="#/delivery-update" data-route="/delivery-update"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        修改物流
      </a>
      <a href="#/delivery-compensate" data-route="/delivery-compensate"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        补发订单
      </a>

      <div class="px-5 mt-5 mb-1.5">
        <p class="text-xs tracking-wider text-warm-400 font-medium">其他</p>
      </div>
      <a href="#/notice" data-route="/notice"
        class="nav-link flex items-center gap-3 px-5 py-2 text-sm cursor-pointer mx-2 rounded-md">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
        公告
      </a>
    </nav>

    <main id="main-content" class="flex-1 p-6 overflow-y-auto"></main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/express-companies.js"></script>
  <script src="/js/store-config.js"></script>
  <script src="/js/shop.js"></script>
  <script src="/js/order.js"></script>
  <script src="/js/delivery-update.js"></script>
  <script src="/js/delivery-compensate.js"></script>
  <script src="/js/logs.js"></script>
  <script src="/js/notice.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
